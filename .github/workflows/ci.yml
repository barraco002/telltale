name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows, Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile telltale.py

      - name: Alert rules
        run: python tests/test_advisor.py

      - name: Sensor self-test
        run: python telltale.py --self-test --samples 1 --interval 0.1

      - name: GUI smoke test
        run: python tests/smoke_gui.py

      - name: Package installs and runs
        run: |
          pip install ".[all]"
          telltale-cli --version
