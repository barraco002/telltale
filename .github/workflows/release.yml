name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload for (for example v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  exe:
    name: Build Telltale.exe
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Test before building
        run: python tests/test_advisor.py

      - name: Build
        run: pyinstaller --noconfirm --windowed --onefile --name Telltale --icon assets/telltale.ico --add-data "assets;assets" telltale.py

      - name: Checksum
        run: |
          $hash = (Get-FileHash dist/Telltale.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Telltale.exe" | Out-File -Encoding ascii dist/Telltale.exe.sha256
          Get-Content dist/Telltale.exe.sha256
          "{0:N1} MB" -f ((Get-Item dist/Telltale.exe).Length / 1MB)

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" dist/Telltale.exe dist/Telltale.exe.sha256 --clobber
