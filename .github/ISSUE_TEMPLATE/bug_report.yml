name: Bug report
description: Something in Telltale is broken, wrong, or looks off.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that makes the bug appear.
      placeholder: |
        1. Start Telltale with python telltale.py
        2. Open a heavy app
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: false

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: 3.12.4
    validations:
      required: false

  - type: input
    id: hardware
    attributes:
      label: Hardware (CPU and GPU)
      placeholder: Intel i7-4790, NVIDIA GT 710
    validations:
      required: false

  - type: textarea
    id: self-test
    attributes:
      label: Output of python telltale.py --self-test
      description: Run this command and paste the full output.
      render: text
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here.
    validations:
      required: false
