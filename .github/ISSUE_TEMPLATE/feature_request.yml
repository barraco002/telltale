name: Feature request
description: Suggest an improvement for Telltale.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where Telltale falls short today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should Telltale do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or existing tools you looked at.
    validations:
      required: false

  - type: checkboxes
    id: design-principles
    attributes:
      label: Fits the design principles
      description: Check the ones this request respects.
      options:
        - label: It keeps Telltale quiet unless action is needed
        - label: It only shows real sensor data
        - label: It adds no heavy dependencies
